services:
  mc:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "26.2"
      NEOFORGE_VERSION: "26.2.0.38-beta"
      PACKWIZ_URL: "https://raw.githubusercontent.com/eloircorona/pcf-smp/main/pack.toml"

      # Memory — ajusta según tu máquina (mínimo 3G para este pack)
      MEMORY: "4G"
      JVM_XX_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1"

      # Server settings
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      SPAWN_PROTECTION: "0"
      ENABLE_WHITELIST: "false"
      ENFORCE_WHITELIST: "false"
      MOTD: "PCF-SMP — Testing Server"
      ICON: ""

      # Ops — agrega tu username aquí
      OPS: ""

      # RCON — para enviar comandos desde la terminal
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "local"

    volumes:
      - mc-data:/data

volumes:
  mc-data:
