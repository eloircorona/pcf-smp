name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0)'
        required: true
        default: '0.2.0'

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Release Please gestiona versión y changelog ──────────────────────────
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.major }}.${{ steps.rp.outputs.minor }}.${{ steps.rp.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build + publicar en CurseForge cuando se crea una release o manualmente ──
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Export CurseForge pack
        run: packwiz curseforge export

      - name: Find exported zip
        id: zip
        run: echo "path=$(ls *.zip | head -1)" >> $GITHUB_OUTPUT

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          VERSION: ${{ needs.release-please.outputs.version || github.event.inputs.version }}
        run: |
          ZIP_PATH="${{ steps.zip.outputs.path }}"

          # Obtener dinámicamente los IDs correspondientes a la versión actual de Minecraft y NeoForge
          METADATA=$(python3 -c "
          import json, os, urllib.request

          cf_api_key = os.environ.get('CF_API_KEY')
          version = os.environ.get('VERSION')

          # Obtener la versión de Minecraft de pack.toml
          minecraft_ver = '26.2'
          if os.path.exists('pack.toml'):
              with open('pack.toml', 'r') as f:
                  for line in f:
                      if 'minecraft =' in line:
                          minecraft_ver = line.split('=')[1].strip().strip('\"').strip(\"'\")

          # Consultar el endpoint de versiones de CurseForge
          req = urllib.request.Request(
              'https://minecraft.curseforge.com/api/game/versions',
              headers={'X-Api-Token': cf_api_key}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  versions = json.loads(response.read().decode())
          except Exception as e:
              print(f'Error al consultar CurseForge: {e}', file=os.sys.stderr)
              versions = []

          mc_id = None
          neoforge_id = None

          for v in versions:
              name = v.get('name', '')
              slug = v.get('slug', '')
              if name == minecraft_ver:
                  mc_id = v.get('id')
              if slug == 'neoforge' or name == 'NeoForge':
                  neoforge_id = v.get('id')

          # Fallback si no los encuentra de forma exacta
          for v in versions:
              name = v.get('name', '').lower()
              if not mc_id and name == minecraft_ver.lower():
                  mc_id = v.get('id')
              if not neoforge_id and name == 'neoforge':
                  neoforge_id = v.get('id')

          game_versions = [x for x in [mc_id, neoforge_id] if x is not None]

          changelog = open('CHANGELOG.md').read() if os.path.exists('CHANGELOG.md') else 'See GitHub releases.'
          meta = {
              'changelog': changelog,
              'changelogType': 'markdown',
              'displayName': f'PCF-SMP v{version}',
              'releaseType': 'release',
              'gameVersions': game_versions
          }
          print(json.dumps(meta))
          ")

          HTTP_STATUS=$(curl -s \
            -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=$METADATA;type=application/json" \
            -F "file=@$ZIP_PATH" \
            -o /tmp/cf_response.json \
            -w "%{http_code}" \
            "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")

          echo "CurseForge response (HTTP $HTTP_STATUS):"
          cat /tmp/cf_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Upload failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Attach zip to GitHub Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${{ steps.zip.outputs.path }}" --clobber
