name: Convert Modrinth to CurseForge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Run Converter
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 convert_to_curseforge.py

      - name: Refresh index
        run: packwiz refresh

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git add mods/ index.toml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pack): convert Modrinth mods to CurseForge format" && git push)
